
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Đăng ký</title>
</head>
<body>

<form>

    <fieldset>
        <legend>Thông tin cá nhân</legend>

        Họ và tên:
        <input type="text" name="hoten" size="25">
        <br><br>

        Email:
        <input type="email" name="email" size="25">
        <br><br>

        Mật khẩu:
        <input type="password" name="matkhau" size="25">
        <br><br>

    </fieldset>

    <br>

    <fieldset>
        <legend>Giới tính</legend>

        <input type="radio" name="gioitinh" value="Nam"> Nam

        <input type="radio" name="gioitinh" value="Nu"> Nữ

        <input type="radio" name="gioitinh" value="Khac"> Khác

    </fieldset>

    <br>

    <fieldset>
        <legend>Sở thích</legend>

        <input type="checkbox" name="sothich" value="Amnhac"> Âm nhạc
        <br>

        <input type="checkbox" name="sothich" value="Thethao"> Thể thao
        <br>

        <input type="checkbox" name="sothich" value="Dulich"> Du lịch

    </fieldset>

    <br>

    <input type="submit" value="Đăng ký">

</form>

</body>
</html>
