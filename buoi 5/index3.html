
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Đăng ký môn học</title>
</head>
<body>

<h2 align="center">Đăng ký môn học</h2>

<form>

    <fieldset>
        <legend>Thông tin sinh viên</legend>

        Mã SV:
        <input type="text" name="masv" size="20">
        <br><br>

        Họ tên:
        <input type="text" name="hoten" size="20">
        <br><br>

    </fieldset>

    <fieldset>
        <legend>Chọn môn học</legend>

        <select name="monhoc">
            <option>Toán</option>
            <option>Văn</option>
            <option>Anh</option>
            <option>Tin học</option>
            <option>Vật lý</option>
        </select>

    </fieldset>

    <fieldset>
        <legend>Ghi chú</legend>

        <textarea name="ghichu" rows="5" cols="50"></textarea>

    </fieldset>

    <input type="submit" value="Đăng ký">

</form>

</body>
</html>
